[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "organism-simulation-sandbox"
version = "0.1.0"
description = "A deterministic 2D entity simulation sandbox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5,<3",
    "pygame_gui>=0.6.14,<0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
simulation-sandbox = "sim_sandbox.app:main"
simulation-benchmark = "sim_sandbox.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

